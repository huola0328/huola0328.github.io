# 演示 3：两个 Pod 共享同一张物理 GPU（需先应用 time-slicing 配置）
# 二者都申请 nvidia.com/gpu: 1，但底层落在同一张物理卡上。
# 在容器内同时跑 nvidia-smi，会看到相同的物理 GPU UUID。
apiVersion: v1
kind: Pod
metadata:
  name: shared-gpu-a
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.0-base-ubuntu22.04
      command: ["/bin/bash", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: shared-gpu-b
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.0-base-ubuntu22.04
      command: ["/bin/bash", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
