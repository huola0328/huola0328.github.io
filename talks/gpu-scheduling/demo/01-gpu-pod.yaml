# 演示 1：申请一张 GPU 的最简单 Pod
# 容器启动后会持续打印 nvidia-smi 输出，证明 GPU 已被分配进容器
apiVersion: v1
kind: Pod
metadata:
  name: gpu-demo
  labels:
    app: gpu-demo
spec:
  restartPolicy: Never
  containers:
    - name: cuda
      image: nvidia/cuda:12.4.0-base-ubuntu22.04
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "===== 容器内可见的 GPU ====="
          nvidia-smi
          echo "===== NVIDIA_VISIBLE_DEVICES ====="
          echo "$NVIDIA_VISIBLE_DEVICES"
          sleep 3600
      resources:
        limits:
          nvidia.com/gpu: 1   # 关键：只能写 limits，requests 自动等于它
