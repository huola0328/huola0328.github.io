# 完整 Deployment：探针 + 配置注入 + 资源限额 + 优雅停机
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  labels:
    app: demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      # 给 Spring 优雅停机留足时间（要 >= timeout-per-shutdown-phase）
      terminationGracePeriodSeconds: 40
      containers:
        - name: demo
          image: myorg/demo:1.0      # 替换成你 build-image 出来的镜像
          ports:
            - containerPort: 8080
          # 从 ConfigMap 一次性注入所有键为环境变量
          envFrom:
            - configMapRef:
                name: demo-config
          # HPA 依赖 requests 才能算使用率，务必设置
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          # 慢启动保护：启动期间不跑 liveness，避免无限重启
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          # 存活探针：失败则重启容器
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          # 就绪探针：失败则从 Service 摘除（不重启）
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
